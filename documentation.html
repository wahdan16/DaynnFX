<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dayn Forex Journey</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
    /* ==========================
   RESET
========================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}

/* ==========================
BODY
========================== */

body{

    font-family:'Poppins',sans-serif;

    background:#071626;

    color:white;

}

/* ==========================
NAVBAR
========================== */

nav{

    width:100%;

    height:80px;

    background:#071626;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 80px;

    position:fixed;

    top:0;

    z-index:999;

    border-bottom:1px solid rgba(255,255,255,.08);

}

.logo{

    font-family:'Bebas Neue';

    font-size:36px;

    letter-spacing:2px;

    color:#ffffff;

}

nav ul{

    display:flex;

    list-style:none;

}

nav ul li{

    margin-left:40px;

}

nav ul li a{

    color:white;

    text-decoration:none;

    font-size:18px;

    transition:.3s;

}

nav ul li a:hover{

    color:#0A84FF;

}

/* ==========================
HERO
========================== */

.hero{

    width:100%;

    height:100vh;

    background:

    linear-gradient(

    rgba(7,22,38,.85),

    rgba(7,22,38,.90)

    ),

    url("../images/server.jpg");

    background-size:cover;

    background-position:center;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

}

.hero-content{

    max-width:900px;

}

.hero h1{

    font-family:'Bebas Neue';

    font-size:90px;

    letter-spacing:4px;

}

.hero p{

    margin-top:20px;

    font-size:24px;

    color:#9FB9DD;

}

.btn{

    display:inline-block;

    margin-top:40px;

    padding:16px 45px;

    background:#0A84FF;

    color:white;

    text-decoration:none;

    border-radius:50px;

    transition:.3s;

}
/*==========================
START LEARNING
==========================*/

.learning{

    padding:120px 8%;

    background:#091A2D;

}

.learning h2{

    font-family:'Bebas Neue';

    font-size:64px;

    text-align:center;

    letter-spacing:3px;

}

.subtitle{

    max-width:700px;

    margin:20px auto 60px;

    text-align:center;

    color:#9FB9DD;

    font-size:18px;

}

.learning-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

    gap:30px;

}

.lesson{

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    padding:35px;

    transition:.35s;

}

.lesson:hover{

    transform:translateY(-10px);

    border-color:#0A84FF;

    box-shadow:0 0 25px rgba(10,132,255,.35);

}

.lesson span{

    display:inline-block;

    width:55px;

    height:55px;

    line-height:55px;

    text-align:center;

    background:#0A84FF;

    border-radius:50%;

    font-weight:bold;

    margin-bottom:20px;

}

.lesson h3{

    margin-bottom:15px;

    font-size:26px;

}

.lesson p{

    color:#B7C6DD;

    line-height:1.8;

    margin-bottom:25px;

}

.lesson a{

    color:#0A84FF;

    text-decoration:none;

    font-weight:600;

}

.lesson a:hover{

    color:#00CFFF;

}
.btn:hover{

    background:#00CFFF;

}

/* ==========================
FOOTER
========================== */

footer{

    background:#05111E;

    text-align:center;

    padding:30px;

    color:#8EA8CC;

}
</style>
</head>

<body>

    <nav>

        <div class="logo">

            DAYN FOREX JOURNEY

        </div>

        <ul>

            <li><a href="index.html">Home</a></li>

            <li><a href="documentation.html">Learning Center</li>

            <li><a href="instagram.html">Instagram</a></li>

        </ul>

    </nav>

    <section class="hero">

        <div class="hero-content">

            <h1>

                DAYN FOREX JOURNEY

            </h1>

            <p>

                Exploring The Technology Behind Trading

            </p>

            <a href="learning.html" class="btn">

                Start Learning

            </a>

        </div>

    </section>

    <footer>

        © 2026 Dayn Forex Journey

    </footer>

</body>

</html>
