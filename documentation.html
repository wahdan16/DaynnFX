<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayn Forex Journey</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        /* ==========================
           RESET
        ========================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ==========================
           BODY
        ========================== */
        body {
            font-family: 'Poppins', sans-serif;
            background: #071626;
            color: white;
        }

        /* ==========================
           NAVBAR
        ========================== */
        nav {
            width: 100%;
            height: 80px;
            background: #071626;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 80px;
            position: fixed;
            top: 0;
            z-index: 999;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .logo {
            font-family: 'Bebas Neue';
            font-size: 36px;
            letter-spacing: 2px;
            color: #ffffff;
            display: flex;
            align-items: center;
        }

        /* Fixed Logo Image */
        .logo img {
            height: 35px;
            width: auto;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 40px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: .3s;
        }

        nav ul li a:hover {
            color: #0A84FF;
        }

        /* Hamburger Icon Styles */
        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 6px;
        }

        .hamburger .bar {
            width: 25px;
            height: 3px;
            background-color: white;
            transition: all 0.3s ease-in-out;
            border-radius: 5px;
        }

        /* ==========================
           HERO
        ========================== */
        .hero {
            width: 100%;
            height: 100vh;
            background:
                linear-gradient(rgba(7, 22, 38, .85), rgba(7, 22, 38, .90)),
                url("../images/server.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            max-width: 900px;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Bebas Neue';
            font-size: 90px;
            letter-spacing: 4px;
        }

        .hero p {
            margin-top: 20px;
            font-size: 24px;
            color: #9FB9DD;
        }

        .btn {
            display: inline-block;
            margin-top: 40px;
            padding: 16px 45px;
            background: #0A84FF;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: .3s;
        }

        .btn:hover {
            background: #00CFFF;
        }

        /* ==========================
           FOOTER
        ========================== */
        footer {
            background: #05111E;
            text-align: center;
            padding: 30px;
            color: #8EA8CC;
        }

        /* ==========================
           RESPONSIVE & MOBILE MENU
        ========================== */
        @media (max-width: 768px) {
            nav {
                padding: 0 30px;
            }

            .hamburger {
                display: flex;
            }

            /* Hide default menu and setup mobile drawer */
            nav ul {
                position: absolute;
                top: 80px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 80px);
                background: #071626;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                padding-top: 60px;
                transition: left 0.3s ease;
                border-top: 1px solid rgba(255, 255, 255, .08);
            }

            nav ul li {
                margin: 20px 0;
            }

            /* Active class to slide the menu in */
            nav ul.active {
                left: 0;
            }

            /* Hamburger Animation to 'X' */
            .hamburger.active .bar:nth-child(1) {
                transform: translateY(9px) rotate(45deg);
            }
            
            .hamburger.active .bar:nth-child(2) {
                opacity: 0;
            }
            
            .hamburger.active .bar:nth-child(3) {
                transform: translateY(-9px) rotate(-45deg);
            }

            .hero h1 {
                font-size: 50px;
            }

            .hero p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            <!-- Removed the invalid height="80x" and moved sizing to CSS -->
            <img src="logo.png" alt="Dayn Forex Logo">
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="documentation.html">Learning Center</a></li>
            <li><a href="https://www.instagram.com/daynfx_/">Instagram</a></li>
        </ul>

        <!-- Hamburger Icon -->
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>DAYN FOREX JOURNEY</h1>
            <p>Exploring The Technology Behind Trading</p>
            <a href="learning.html" class="btn">Start Learning</a>
        </div>
    </section>

    <footer>
        © 2026 Dayn Forex Journey
    </footer>

    <!-- Script for toggling the hamburger menu -->
    <script>
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            // Toggles the active class on both the hamburger and the navigation links
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
    </script>
</body>

</html>
